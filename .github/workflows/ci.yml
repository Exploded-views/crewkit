name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrub:
    name: scrub (secret rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test the scrub rules
        run: tools/scrub.sh --self-test
      - name: Scrub tracked files (secret rules only; the private denylist never leaves its owner's machine)
        run: tools/scrub.sh --secrets-only

  secrets:
    name: secrets (gitleaks over every commit, the pinned build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The pinned gitleaks, checked against pins/gitleaks.env (install.sh)
        run: ./install.sh --yes --only gitleaks
      - name: gitleaks over every commit on every ref (fails closed; tools/secrets-scan.sh)
        run: tools/secrets-scan.sh

  lint:
    name: skills and markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Frontmatter, manifests, hooks, eval cases, relative links
        run: python3 tools/lint-skills.py
      - name: Workflows use GitHub-hosted runners, no pull_request_target, actions pinned by SHA
        run: python3 tools/check-workflows.py
      - name: Mutation check on the workflow lint
        run: python3 tools/mutate-check-workflows.py
      # The required check's own mutants run here too, so they keep running while the repo is
      # private and the mutants matrix is off.
      - name: Mutation check on ci-ok and its lint
        run: python3 tools/mutate.py tests/mutants/ci-ok.json && python3 tools/mutate.py tests/mutants/lint-ci-ok.json
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"

  mutants:
    name: mutation check ${{ matrix.spec }}
    # Off while the repo is private (Actions minutes); ci-ok accepts the skip only then.
    # Run locally: flock ~/.local/state/crew/heavy.lock python3 tools/mutate.py tests/mutants/<spec>.json
    # (see docs/testing.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every tests/mutants/*.json, listed here; tools/lint-skills.py fails on one missing.
        # The one exception is a spec tagged "local_gate_only" (too slow for this job's time limit)
        # and held in tests/mutants/local-gate.txt; the lint fails a tagged spec listed here.
        spec:
          - check-watcher-settings.json
          - checks.json
          - bats-shards.json
          - ci-ok.json
          - coverage-py-sh.json
          - crewkit-acceptance-cli.json
          - crewkit-acceptance-doctor.json
          - crewkit-acceptance-install.json
          - crewkit-acceptance-nodereport.json
          - crewkit-acceptance-report.json
          - crewkit-claudesettings.json
          - crewkit-spend.json
          - coverage-sh.json
          - crewkit-common.json
          - crewkit-dispatch.json
          - crewkit-doctor.json
          - crewkit-herdr.json
          - crewkit-holder.json
          - crewkit-holder-ntfy.json
          - crewkit-holder-tokens.json
          - crewkit-outbox.json
          - crewkit-owner-send.json
          - crewkit-pointer.json
          - crewkit-node-report.json
          - crewkit-registry.json
          - crewkit-usersettings.json
          - crewkit-watchline.json
          - crewkit-watchline-cli.json
          - crewkit-watchline-settings.json
          - crewkit-watchline-usersettings.json
          - export.json
          - gh-write.json
          - heavy-lock.json
          - install-bitc-record.json
          - install-hooks.json
          - kcov-dockerfile.json
          - land-batch-merge.json
          - land-batch.json
          - landing-lib-ci.json
          - landing-lib-gates.json
          - landing-lib-inputs.json
          - landing-lib-model.json
          - landing-lib-risk.json
          - landing-lib-verdict.json
          - landing-lib-workflow.json
          - lane-hygiene.json
          - lane-land-checks.json
          - lane-land-config.json
          - lane-land-gates.json
          - lane-land-merge.json
          - lane-land-verdict.json
          - lane-new.json
          - lane-refresh.json
          - lane-state.json
          - lane-verdict.json
          - lint-ci-ok.json
          - lint-conflicts.json
          - lint-mutant-matrix.json
          - memory-notices.json
          - memory-notices-shared-index.json
          - memory-notices-time-scale.json
          - coverage-py-time-scale.json
          - coverage-time-scale.json
          - run-time-scale.json
          - lint-markdown.json
          - linux-gate.json
          - linux-gate-holds.json
          - linux-gate-holds-run.json
          - mutate-check-workflows-lock.json
          - mutate-sh-lock.json
          - mutate.json
          - no-bypass-hook.json
          - pane-ask-settings.json
          - pane-ask.json
          - public-watch.json
          - push-gate-2.json
          - push-gate-3.json
          - push-gate-dispatch.json
          - push-gate-shim.json
          - push-gate.json
          - roles-lint.json
          - run-shard.json
          - scrub-allow.json
          - scrub-history.json
          - scrub-private-infra.json
          - scrub-rules.json
          - secrets-scan.json
          - settings.json
          - stub-reaper.json
          - verdict.json
          - watchline.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mutation check (every mutant must fail the suite)
        run: python3 tools/mutate.py "tests/mutants/${{ matrix.spec }}"

  install-mutants:
    name: mutation check on install.sh's key lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every install.sh mutant must fail the suite
        run: tools/mutate.sh

  shell:
    name: shellcheck and install dry run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the runner)
        run: |
          # Plugin scripts are mixed bash and Python: check the ones with a bash shebang.
          mapfile -t plugin_sh < <(grep -l '^#!/usr/bin/env bash' plugins/crew-*/bin/* 2>/dev/null || true)
          # The crewkit CLI: the dispatcher and the verbs' scripts (none yet is fine).
          mapfile -t libexec_sh < <(compgen -G 'libexec/crewkit-*' || true)
          shellcheck -x install.sh bin/crewkit tools/*.sh tests/run.sh tests/stub-gh evals/*.sh "${plugin_sh[@]}" "${libexec_sh[@]}" push-gate/push-gate.sh push-gate/hooks/_dispatch
          shellcheck -s sh push-gate/shim.sh
          shellcheck -s bash tests/*.bash lib/settings.sh libexec/ck/*.sh
      - name: install.sh dry run changes nothing and exits 0
        run: ./install.sh
      - name: install.sh rejects bad usage with exit 64
        run: |
          set +e
          ./install.sh --bogus >/dev/null 2>&1
          test $? -eq 64

  tests:
    # The bats files in 4 groups, split by measured file time (tests/bats-times.json,
    # tools/bats-shards.py), so each group fits its limit. ci-ok needs this job: every shard.
    name: bats suites and performance budgets (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the times table names exactly tests/*.bats
        run: python3 tools/bats-shards.py check
      - name: bats suite, this shard (pinned bats-core)
        run: tests/run.sh --shard "${{ matrix.shard }}/4" --timing
      - name: coverage-floors unit tests
        if: ${{ matrix.shard == 1 }}
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: performance budgets (perf-budgets.json; CI headroom applies)
        if: ${{ matrix.shard == 1 }}
        run: python3 tools/perf.py

  kcov-image:
    # Builds the kcov image once for the shards (or finds it in the Actions cache): on a cache miss four shards
    # building at once would be four times the load on the Debian snapshot mirror, which has stalled and timed out.
    # Keyed by the recipe and the pinned base image; three tries of 7 minutes each.
    name: kcov image (built once, kept in the cache)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned base image, for the cache key
        id: pin
        run: echo "base=$(tools/coverage.sh --pinned-image)" >> "$GITHUB_OUTPUT"
      - name: the kcov image, if an earlier run kept it
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/crewkit-kcov.tar
          key: kcov-image-${{ hashFiles('docker/crewkit-kcov.Dockerfile') }}-${{ steps.pin.outputs.base }}
      - name: kcov image with git, jq, procps and openssh-client (built on the runner, never pushed; kept in the cache)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          # docker/crewkit-kcov.Dockerfile: the pinned kcov image plus git, jq, procps and openssh-client (bats enforces
          # BATS_TEST_TIMEOUT with ps), from a dated Debian snapshot (the Linux gate builds the same file).
          built=
          for attempt in 1 2 3; do
            if timeout 420 docker build -t crewkit-kcov --build-arg BASE="${{ steps.pin.outputs.base }}" -f docker/crewkit-kcov.Dockerfile docker; then
              built=yes
              break
            fi
            echo "image build attempt $attempt failed; trying again"
            sleep 20
          done
          test -n "$built"
          docker save -o "$RUNNER_TEMP/crewkit-kcov.tar" crewkit-kcov

  kcov:
    # kcov over the bash scripts in 4 shards: `tools/coverage.sh --shard K/4` runs the bats files
    # tools/bats-shards.py gives it, in the image kcov-image built or found in the cache.
    name: coverage under kcov (bash), shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: kcov-image
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned base image, for the cache key
        id: pin
        run: echo "base=$(tools/coverage.sh --pinned-image)" >> "$GITHUB_OUTPUT"
      - name: the kcov image, if an earlier run kept it
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/crewkit-kcov.tar
          key: kcov-image-${{ hashFiles('docker/crewkit-kcov.Dockerfile') }}-${{ steps.pin.outputs.base }}
      - name: kcov image with git, jq, procps and openssh-client (only if the cache lost it since kcov-image)
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          # docker/crewkit-kcov.Dockerfile: the pinned kcov image plus git, jq, procps and openssh-client (bats enforces
          # BATS_TEST_TIMEOUT with ps), from a dated Debian snapshot (the Linux gate builds the same file).
          built=
          for attempt in 1 2 3; do
            if timeout 420 docker build -t crewkit-kcov --build-arg BASE="${{ steps.pin.outputs.base }}" -f docker/crewkit-kcov.Dockerfile docker; then
              built=yes
              break
            fi
            echo "image build attempt $attempt failed; trying again"
            sleep 20
          done
          test -n "$built"
          docker save -o "$RUNNER_TEMP/crewkit-kcov.tar" crewkit-kcov
      - name: load the cached kcov image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/crewkit-kcov.tar"
      - name: coverage under kcov, this shard (see tools/coverage.sh)
        env:
          KCOV_IMAGE: crewkit-kcov
        run: tools/coverage.sh --shard "${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kcov-shard-${{ matrix.shard }}
          path: .cache/coverage-shards/shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  coverage-py:
    # coverage.py over the plugins' Python tools in 4 groups: `tools/coverage-py.sh --shard K/4`
    # runs the bats files tools/bats-shards.py gives it (and the Python unit tests, in shard 1).
    name: coverage.py shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: coverage.py (pinned by sha256, installed here only)
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r tools/requirements-coverage.txt
      - name: this shard
        env:
          COVERAGE_VENV: ${{ runner.temp }}/coverage-venv
        run: tools/coverage-py.sh --shard "${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py-shard-${{ matrix.shard }}
          path: .cache/coverage-py/shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  coverage:
    # The ratchet: the kcov report and the combined coverage.py shards, against the floors.
    name: coverage (kcov for bash, coverage.py for Python), and the ratchet
    needs: [kcov, coverage-py]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ratchet compares floors with the merge base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: coverage.py (pinned by sha256, installed here only)
        run: |
          python3 -m venv "$RUNNER_TEMP/coverage-venv"
          "$RUNNER_TEMP/coverage-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r tools/requirements-coverage.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kcov-shard-*
          path: .cache/coverage-shards
      - name: merge the kcov shards (refuses a missing, unfinished or stale shard; the pinned base image only, no apt)
        run: |
          for d in .cache/coverage-shards/kcov-shard-*; do
            mv "$d" ".cache/coverage-shards/shard-${d##*-}"
          done
          for attempt in 1 2 3; do
            docker pull "$(tools/coverage.sh --pinned-image)" && break
            echo "pull attempt $attempt failed; trying again"
            sleep 15
          done
          tools/coverage.sh --merge 4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-py-shard-*
          path: .cache/coverage-py
      - name: combine the coverage.py shards (refuses a missing, unfinished or stale shard)
        env:
          COVERAGE_VENV: ${{ runner.temp }}/coverage-venv
        run: |
          for d in .cache/coverage-py/coverage-py-shard-*; do
            mv "$d" ".cache/coverage-py/shard-${d##*-}"
          done
          tools/coverage-py.sh --combine 4
      - name: floors hold and never move down
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Fail closed: a PR must compare with its merge base; a push compares with the
          # commit it replaced. Only a brand-new branch (no before) has nothing to compare.
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$PR_BASE")
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qx '0*'; then
            base=$PUSH_BEFORE
          else
            base=
          fi
          args=()
          if [ -n "$base" ]; then
            if git cat-file -e "$base:coverage-floors.json" 2>/dev/null; then
              git show "$base:coverage-floors.json" > "$RUNNER_TEMP/base-floors.json"
              args=(--base-floors "$RUNNER_TEMP/base-floors.json")
            else
              echo "no coverage-floors.json at $base: first floors, nothing to compare"
            fi
          fi
          python3 tools/coverage-floors.py --report .cache/coverage/bats.*/coverage.json \
            --report .cache/coverage-py/report.json "${args[@]}"


  bash32:
    # install.sh under bash 3.2 on Linux, on every PR, private or public: macOS's /bin/bash is
    # 3.2 and the macos job is off while the repo is private. docker run, not a container: job,
    # so the same commands run locally (with RUNNER_TEMP set to a scratch directory).
    name: install.sh under bash 3.2 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASH32: bash:3.2@sha256:b6252c62fc86114f93f02104a486c71e6569371d95950ea7479a2ffd6b47f16a # scrub:pinned-hash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dry run with bash 3.2
        run: docker run --rm -v "$PWD:/w:ro" -w /w "$BASH32" bash -c 'bash --version | head -1 && bash ./install.sh'
      - name: crewkit under bash 3.2 refuses to run (exit 78)
        run: |
          set +e
          docker run --rm -v "$PWD:/w:ro" -w /w "$BASH32" bash bin/crewkit --version
          test $? -eq 78
      - name: dry run with bash 3.2, memsync pinned and no flags after --
        run: |
          tree="${RUNNER_TEMP:?}/bash32"
          rm -rf "$tree" && mkdir -p "$tree" && git ls-files -z | xargs -0 cp --parents -t "$tree"
          {
            echo "MEMSYNC_URL=https://example.test/o/claude-utils/releases/download"
            echo "MEMSYNC_TAG=v0.1.0"
            for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
              echo "MEMSYNC_SHA256_$t=$(printf 'a%.0s' $(seq 64))"
            done
          } > "$tree/pins/memsync.env"
          docker run --rm -v "$tree:/w:ro" -w /w "$BASH32" bash ./install.sh --only memsync

  macos:
    name: install.sh on macOS (stock bash 3.2)
    # Off while the repo is private (macOS minutes bill at 10x); bash32 covers bash 3.2 meanwhile.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dry run with /bin/bash (3.2), unpinned
        run: /bin/bash --version | head -1 && /bin/bash ./install.sh
      - name: dry run with /bin/bash (3.2), memsync pinned and no flags after --
        run: |
          {
            echo "MEMSYNC_URL=https://example.test/o/claude-utils/releases/download"
            echo "MEMSYNC_TAG=v0.1.0"
            for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
              echo "MEMSYNC_SHA256_$t=$(printf 'a%.0s' $(seq 64))"
            done
          } > pins/memsync.env
          /bin/bash ./install.sh --only memsync

  ci-ok:
    # The one check main's ruleset requires: green only when every other job succeeded.
    # tools/lint-skills.py fails if a job is missing from needs, so a new job can't skip it.
    name: ci-ok
    if: always()
    needs: [scrub, secrets, lint, mutants, install-mutants, shell, tests, kcov-image, kcov, coverage-py, coverage, bash32, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every needed job succeeded (tools/ci-ok.py)
        env:
          RESULTS: ${{ toJSON(needs) }}
          PRIVATE: ${{ github.event.repository.private }}
        run: python3 tools/ci-ok.py
